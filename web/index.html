<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d13" />
    <meta name="description" content="Botani Terminal — pantau bot trading, strategi, dan riwayat dari HP maupun desktop." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Botani" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-180.png" />
    <title>Botani Terminal</title>
    <style>html,body{background:#090d13}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Probe boot: bila bundle gagal dimuat (cache basi), tampilkan tombol pulih
      setTimeout(function () {
        if (!document.getElementById('root').hasChildNodes()) {
          document.body.innerHTML = '<div style="padding:24px;font:14px sans-serif;color:#f0b90b">Aplikasi gagal dimuat (kemungkinan cache lama).<br><br><button onclick="fetch(location.href,{cache:\'reload\'}).then(()=>location.reload(true))" style="padding:8px 16px;border-radius:6px;border:1px solid #4f7cff;background:transparent;color:#fff">Muat ulang bersih</button></div>';
        }
      }, 8000);
    </script>
  </body>
</html>
